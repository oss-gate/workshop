type: supporter
questions:
  # 参加した理由
  motivation:
    # どうしてこのワークショップに参加しようと思いましたか？
    # どうしてRubyエコシステムの開発に参加する人が増えるといいなぁと
    # 思っていますか？
    # みんなのためとか世界のためとかでもよいですが、
    # 個人的な理由でもまったく問題ありません。
    # 自分の思っていることを大事にしたいのです。
    去年からRubyに関わり始め、今年からOSS活動を行っていて、社内で開催すると聞いて、せっかくなら参加したいと思ったからです。RubyのOSS活動というか、コミュニティがすごく温かいのでこの環境が続くためにも、そしてみんなで楽しみたいのでRubyエコシステムの開発に参加する人が増えてほしいなと思っています。
  # 見つけた場所
  via:
    # どこでこのワークショップを知りましたか？
    社内のお知らせ
  # このワークショップでビギナーをサポートできましたか？
  supported:
    # ビギナーのみんなをうまくサポートできましたか？
    # どのようなサポートが効いた気がしますか？
    # こうやったらもっとうまくサポートできただろうなぁというアイディアは
    # ありますか？
    上手くサポートできませんでした。カナシイ。OSSにコントリビュートしたことあるけどRubyはないとかのビギナーの方が多かったので、なんとなくみなさんスムーズにやっていたので特に助けると言うより、一緒に悩むみたいな感じになってしまいました。でも一緒に悩んで解決できたシーンもあったからぎりぎり良し。
  # ビギナーのみんなに一言
  to-beginners:
    # これからみなさんの開発仲間になるだろうビギナーのみんなになにか
    # 伝えたいことはありますか？
    今日をきっかけに、OSS活動続けていきましょう!!!!!!次はサポーターですね!!!!
  # その他
  etc:
    # なにか思ったことがあれば自由に書いてください。
    他の人がやっているのを見るだけでもこちらのやる気にもなって楽しかったです!!!!
