type: beginner
questions:
  # 参加した理由
  motivation:
    # どうしてこのワークショップに参加しようと思いましたか？
    # どうしてRubyエコシステムの開発に参加したいと思っていますか？
    # みんなのためとか世界のためとかでもよいですが、
    # 個人的な理由でもまったく問題ありません。
    # 自分の思っていることを大事にしたいのです。
    「debug gemにPRを出したいけどどのように進めればいいかわからない」と思っていたところに開催の知らせを受けたのでいいタイミングだと思いました。Rubyのみんなで作るという姿勢に共感しています。
  # 見つけた場所
  via:
    # どこでこのワークショップを知りましたか？
    会社で参加を進められたことがきっかけでした。
  # 開発対象
  target:
    # ワークショップで開発対象に選んだプロダクトはなんですか？
    debug gem
  # 今後のRubyエコシステムの開発への参加について
  future:
    # このワークショップで開発への参加の敷居は下がりましたか？
    # 今後は問題を見つけたときに開発元にフィードバックしたり修正を送ったり
    # できそうですか？
    # まだ参加への障害がありそうなら教えてください。
    敷居が下がった。今後も続けたいと思います。
  # その他
  etc:
    # なにか思ったことがあれば自由に書いてください。
    楽しかったです！私は基本の進め方から逸脱しましたが、フィードバックするということが想像以上に敷居が低いのだということもわかりました。
