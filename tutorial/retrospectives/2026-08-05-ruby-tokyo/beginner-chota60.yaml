type: beginner
questions:
  # 参加した理由
  motivation:
    # どうしてこのワークショップに参加しようと思いましたか？
    # どうしてRubyエコシステムの開発に参加したいと思っていますか？
    # みんなのためとか世界のためとかでもよいですが、
    # 個人的な理由でもまったく問題ありません。
    # 自分の思っていることを大事にしたいのです。
    - コントリビュートしたい OSS が大きなプロジェクトで、まず一歩目として身近な経路から進めたかったので参加してみました
    - エコシステムに貢献することはコスパがいいと思っています。また、見て見ぬ振りするのは流石に大人としてどうなんだ？という思いもあり・・・
  # 見つけた場所
  via:
    # どこでこのワークショップを知りましたか？
    社内でのお知らせから知りました
  # 開発対象
  target:
    # ワークショップで開発対象に選んだプロダクトはなんですか？
    https://github.com/omniauth/omniauth_openid_connect
  # 今後のRubyエコシステムの開発への参加について
  future:
    # このワークショップで開発への参加の敷居は下がりましたか？
    # 今後は問題を見つけたときに開発元にフィードバックしたり修正を送ったり
    # できそうですか？
    # まだ参加への障害がありそうなら教えてください。
    - 周りの人の取り組みのおかげで、敷居は下がった気がします
    - 自分自身のやりたかったことまではちょっと時間がなかったかなと・・・
  # その他
  etc:
    # なにか思ったことがあれば自由に書いてください。
    より有意義な時間にするには、OSS 選定が大事かも・・・と思いました。
    
    例えば自分が選んだ https://github.com/omniauth/omniauth_openid_connect は、WEBアプリケーションのエンハンスや機能拡張に使われるものです。
    これは前提条件や暗黙的な文脈が存在するため、動かすまでの準備が必要です。
    
    これだとそもそもの準備に時間や頭のリソースを取られてしまうため、例えば Ruby の API に組み込まれているものだったり、独立した形で何かのアウトプットを出すことができる OSS を選ぶことが、時間の使い方として適切になりそうかなと思いました〜！
