  motivation:
    # どうしてこのワークショップに参加しようと思いましたか？
    # どうしてRubyエコシステムの開発に参加したいと思っていますか？
    # みんなのためとか世界のためとかでもよいですが、
    # 個人的な理由でもまったく問題ありません。
    # 自分の思っていることを大事にしたいのです。
    個人的に「どんなものにでも挑戦してみよう」というモチベーションが高まっていたからです。
    また現職の上司が柔軟にしてくださる方だからです。平日開催のため有給を取ろうかと考えていたところ、上司からレポート提出と引き換えに業務扱いにしてよいと促してくださったからです。
    +++
    I currently have a motivation for joinning any events.
    Moreover, my boss agreed that joinning the event is a part of my job, not a personal work.
