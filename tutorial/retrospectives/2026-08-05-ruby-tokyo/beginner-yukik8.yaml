type: beginner
questions:
  # 参加した理由
  motivation:
    # どうしてこのワークショップに参加しようと思いましたか？
    # どうしてRubyエコシステムの開発に参加したいと思っていますか？
    # みんなのためとか世界のためとかでもよいですが、
    # 個人的な理由でもまったく問題ありません。
    # 自分の思っていることを大事にしたいのです。
    Rubyエコシステムの開発に参加していく中で、ソフトウェアエンジニアとしてより深い知見を得たいから。
  # 見つけた場所
  via:
    # どこでこのワークショップを知りましたか？
    RubyのContributorの方にOSSが気になっていると話したところ、紹介してくださった。
  # 開発対象
  target:
    # ワークショップで開発対象に選んだプロダクトはなんですか？
    io-event
  # 今後のRubyエコシステムの開発への参加について
  future:
    # このワークショップで開発への参加の敷居は下がりましたか？
    # 今後は問題を見つけたときに開発元にフィードバックしたり修正を送ったり
    # できそうですか？
    # まだ参加への障害がありそうなら教えてください。
    敷居が下がった。フィードバックや修正を送れそう。普段あまりRubyを触っていなかったけれど、もっと触ってみたいとも思った。
  # その他
  etc:
    # なにか思ったことがあれば自由に書いてください。
    小さいPRでしたが、実際にPRを出すところまでできて、達成感がありました。楽しかったです！
