type: beginner
questions:
  # 参加した理由
  motivation:
    # どうしてこのワークショップに参加しようと思いましたか？
    # どうしてRubyエコシステムの開発に参加したいと思っていますか？
    # みんなのためとか世界のためとかでもよいですが、
    # 個人的な理由でもまったく問題ありません。
    # 自分の思っていることを大事にしたいのです。
    普段社内の自プロダクトにエンジニアが自分しかおらず、日々これで大丈夫なのかという不安でいっぱいのため、目についたイベントに片っ端から参加しているところです。イベントに参加する中で、どうやらrubykaigiなどに出ている人は主にOSSの開発に関わることでrails関連の知識やcrubyへの理解を深めてるっぽいなと気づいたのですが、OSSへの参加の作法がよくわからなかったので参加しました。
  # 見つけた場所
  via:
    # どこでこのワークショップを知りましたか？
    twitterで流れてきた気がします。
  # 開発対象
  target:
    # ワークショップで開発対象に選んだプロダクトはなんですか？
    kaminari gem
  # 今後のRubyエコシステムの開発への参加について
  future:
    # このワークショップで開発への参加の敷居は下がりましたか？
    # 今後は問題を見つけたときに開発元にフィードバックしたり修正を送ったり
    # できそうですか？
    # まだ参加への障害がありそうなら教えてください。
    下がりました。できそうです。
  # その他
  etc:
    # なにか思ったことがあれば自由に書いてください。
    doorkeeprのイベントページにslackのチャンネルを載せていただけると助かります。見落としてたらすみません。
