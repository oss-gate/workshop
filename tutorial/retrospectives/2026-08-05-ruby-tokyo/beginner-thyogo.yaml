type: beginner
questions:
  # 参加した理由
  motivation:
    # どうしてこのワークショップに参加しようと思いましたか？
    # どうしてRubyエコシステムの開発に参加したいと思っていますか？
    # みんなのためとか世界のためとかでもよいですが、
    # 個人的な理由でもまったく問題ありません。
    # 自分の思っていることを大事にしたいのです。
    最近仕事に直接的に関わるコードにしか触れていなかったため
  # 見つけた場所
  via:
    # どこでこのワークショップを知りましたか？
    会社の技術広報から提案してもらった
  # 開発対象
  target:
    # ワークショップで開発対象に選んだプロダクトはなんですか？
    ruby/time
  # 今後のRubyエコシステムの開発への参加について
  future:
    # このワークショップで開発への参加の敷居は下がりましたか？
    # 今後は問題を見つけたときに開発元にフィードバックしたり修正を送ったり
    # できそうですか？
    # まだ参加への障害がありそうなら教えてください。
    今回やった自明な変更についてはとてもとても下がりました
    説明が必要なものについても、小さな変更であれば今回教わったフローで頑張れそうな気がする
    アルゴリズムの変更にはまだ躊躇してしまいそう、小さな変更を積み重ねて作法や手順に自身をつけて、揉まれながらも頑張りたい
  # その他
  etc:
    # なにか思ったことがあれば自由に書いてください。
    ruby/timeのコメントにあったサンプルコードの結果について修正のPRを出しました
    関連して日本語のるりまにもドキュメントの追加をするPRを出そうとしたのですが、環境構築で躓いてしまいました(手順書通りだとるりまのサーバが動かなかった)
    新たなコントリビュートチャンスを得ることができました!
