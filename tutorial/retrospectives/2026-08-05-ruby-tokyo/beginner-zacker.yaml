type: beginner
questions:
  motivation:
    OSS Contribute のイメージや、温度感を知りたかったため。
    問題を見つけたときに OSS に自分が近づいていくためのイメージが湧かないという課題感がありました。
    また、気軽に Issue や PR を出して良いのか？ という温度感が分らなかったので、それを掴むために参加したいと考えました。
  via:
    社内（giftee）の Slack で呼びかけがあり、そこで見つけました。
  target:
    zdennis/activerecord-import
  future:
    「ドキュメント修正でも良いんだ」というように、 contribute への心理的なハードルは下がったと思います。
    将来、バグを踏んでそこを治すときにも、一連の流れを知っているので Issue や PR を出すことはできそうです。
  etc:
    自分主体で問題を見つけて修正をするという一連の流れをやりきる方法もあると思うのですが、
    他の人が上げた Issue をトリアージするということもやってみたいなと思いました。
