type: supporter
questions:
  # 参加した理由
  motivation:
    # どうしてこのワークショップに参加しようと思いましたか？
    # どうしてRubyエコシステムの開発に参加する人が増えるといいなぁと
    # 思っていますか？
    # みんなのためとか世界のためとかでもよいですが、
    # 個人的な理由でもまったく問題ありません。
    # 自分の思っていることを大事にしたいのです。
    この会のきっかけがオプティムで行われたOSS Gateだったとのことなので、言い出しっぺの法則的な気持ちで参加しました
  # 見つけた場所
  via:
    # どこでこのワークショップを知りましたか？
    オプティムで行われたOSS Gateで「やりたい」という話を聞いて知りました！
  # このワークショップでビギナーをサポートできましたか？
  supported:
    # ビギナーのみんなをうまくサポートできましたか？
    # どのようなサポートが効いた気がしますか？
    # こうやったらもっとうまくサポートできただろうなぁというアイディアは
    # ありますか？
    近くにいる人の応援だけでなく、もっと徘徊していろんな人に声をかけたら良かった気がしました。
  # ビギナーのみんなに一言
  to-beginners:
    # これからみなさんの開発仲間になるだろうビギナーのみんなになにか
    # 伝えたいことはありますか？
    普段の会社でのプロダクト開発中に、なにか使いづらいなって思ったら、まずupstremに入れられるか考えてみてほしいです！
  # その他
  etc:
    # なにか思ったことがあれば自由に書いてください。
    会場がきれいで広くて羨ましかったです
