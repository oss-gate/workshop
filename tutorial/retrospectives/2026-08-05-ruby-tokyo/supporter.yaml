type: supporter
questions:
  # 参加した理由
  motivation:
    # どうしてこのワークショップに参加しようと思いましたか？
    # どうしてRubyエコシステムの開発に参加する人が増えるといいなぁと
    # 思っていますか？
    # みんなのためとか世界のためとかでもよいですが、
    # 個人的な理由でもまったく問題ありません。
    # 自分の思っていることを大事にしたいのです。
    これからやろうという人の背中を押せるといいかなと思いました。
  # 見つけた場所
  via:
    # どこでこのワークショップを知りましたか？
    前田さんからのお誘い
  # このワークショップでビギナーをサポートできましたか？
  supported:
    # ビギナーのみんなをうまくサポートできましたか？
    # どのようなサポートが効いた気がしますか？
    # こうやったらもっとうまくサポートできただろうなぁというアイディアは
    # ありますか？
    細かーいこと(ヒアドキュメント書き方など)はお手伝いできたかもしれません。サポーター間の連携を特に決めてなかったので参加者のみなさんには同じことを何度も説明させたかもしれません。
  # ビギナーのみんなに一言
  to-beginners:
    # これからみなさんの開発仲間になるだろうビギナーのみんなになにか
    # 伝えたいことはありますか？
    コミュニティで知り合いが増えるとカンファレンスなどで淋しくないので見返り(?)はあると思います。
  # その他
  etc:
    # なにか思ったことがあれば自由に書いてください。
    須藤さんの進行がうまくて楽しかったです。
