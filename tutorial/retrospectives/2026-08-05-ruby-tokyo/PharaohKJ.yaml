type: beginner
questions:
  # 参加した理由
  motivation:
    # どうしてこのワークショップに参加しようと思いましたか？
    # どうしてRubyエコシステムの開発に参加したいと思っていますか？
    # みんなのためとか世界のためとかでもよいですが、
    # 個人的な理由でもまったく問題ありません。
    # 自分の思っていることを大事にしたいのです。
    本当は自分のgemを公開するのにためらいがあって（怖いとか）、そういうのをフォローもらえつつ出せるならやってみようと考えたから。あと、Ruby勢の考えているエコシステムというのがどんなものか体験してみたかった。
  # 見つけた場所
  via:
    # どこでこのワークショップを知りましたか？
    たぶんdoorkeeper
  # 開発対象
  target:
    # ワークショップで開発対象に選んだプロダクトはなんですか？
    https://github.com/ruby/ipaddr
  # 今後のRubyエコシステムの開発への参加について
  future:
    # このワークショップで開発への参加の敷居は下がりましたか？
    # 今後は問題を見つけたときに開発元にフィードバックしたり修正を送ったり
    # できそうですか？
    # まだ参加への障害がありそうなら教えてください。
    だいぶ下がった（一般的なことであって、特殊な・独特な文化というわけではなさそうということがわかり、自信になった）
  # その他
  etc:
    # なにか思ったことがあれば自由に書いてください。
    ありがとうございました！
