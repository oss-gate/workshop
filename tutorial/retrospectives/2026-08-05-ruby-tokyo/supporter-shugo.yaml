type: supporter
questions:
  # 参加した理由
  motivation:
    # どうしてこのワークショップに参加しようと思いましたか？
    # どうしてRubyエコシステムの開発に参加する人が増えるといいなぁと
    # 思っていますか？
    # みんなのためとか世界のためとかでもよいですが、
    # 個人的な理由でもまったく問題ありません。
    # 自分の思っていることを大事にしたいのです。
    主催者だからということもありますが、Rubyや関連ライブラリの開発に参加する人が増えるとうれしいからです。
  # 見つけた場所
  via:
    # どこでこのワークショップを知りましたか？
    須藤さんから開催の提案をいただきました。
  # このワークショップでビギナーをサポートできましたか？
  supported:
    # ビギナーのみんなをうまくサポートできましたか？
    # どのようなサポートが効いた気がしますか？
    # こうやったらもっとうまくサポートできただろうなぁというアイディアは
    # ありますか？
    応援はできたと思いますが、具体的な問題の解決はわりとみなさんが自分でされていた様子でした。IssueとPul requestを両方出すかとか、Pull requestを細かく分けるかとかは自分がわりと雑なのでミスリードしてしまったかもしれません。あと、声をかけるタイミングの判断が難しかったので作業の邪魔になっていなかったか心配です。
  # ビギナーのみんなに一言
  to-beginners:
    # これからみなさんの開発仲間になるだろうビギナーのみんなになにか
    # 伝えたいことはありますか？
    あまり失敗をおそれすぎずに、まずは開発に参加する一歩を踏み出していただけるとうれしいです。
  # その他
  etc:
    # なにか思ったことがあれば自由に書いてください。
    みなさん自発的にテーマを考えていただけてとてもよかったと思います。今後も何かOSSを使っていて気付いたことがあれば、何かしらフィードバックを続けていただければと思います。
