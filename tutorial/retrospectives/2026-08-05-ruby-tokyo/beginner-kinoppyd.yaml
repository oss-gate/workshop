type: beginner
questions:
  # 参加した理由
  motivation:
    # どうしてこのワークショップに参加しようと思いましたか？
    # どうしてRubyエコシステムの開発に参加したいと思っていますか？
    # みんなのためとか世界のためとかでもよいですが、
    # 個人的な理由でもまったく問題ありません。
    # 自分の思っていることを大事にしたいのです。
    Rubyをよく使っているが、CRubyに直接コントリビュートしたことは無いため、何かのきっかけになるかと思い参加しました
  # 見つけた場所
  via:
    # どこでこのワークショップを知りましたか？
    同僚で今日一緒に来ているitoJumが教えてくれました
  # 開発対象
  target:
    # ワークショップで開発対象に選んだプロダクトはなんですか？
    CRuby
  # 今後のRubyエコシステムの開発への参加について
  future:
    # このワークショップで開発への参加の敷居は下がりましたか？
    # 今後は問題を見つけたときに開発元にフィードバックしたり修正を送ったり
    # できそうですか？
    # まだ参加への障害がありそうなら教えてください。
    下がりました、これからもやっていきの気持ちです
  # その他
  etc:
    # なにか思ったことがあれば自由に書いてください。
    Rubyコミッターに囲まれて、天の声がやいのやいの聞こえてくる環境というのは普段ありえないことなので、とても楽しかったです。コミッターに囲まれるもくもく会にちかい感覚だった。
