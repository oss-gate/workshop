type: beginner
questions:
  # 参加した理由
  motivation:
    # どうしてこのワークショップに参加しようと思いましたか？
    # どうしてRubyエコシステムの開発に参加したいと思っていますか？
    # みんなのためとか世界のためとかでもよいですが、
    # 個人的な理由でもまったく問題ありません。
    # 自分の思っていることを大事にしたいのです。
    普段Rubyのエコシステムに対する貢献をしている社外の方からアドバイスをもらいたいと思ったからです。普段あまりOSS貢献について社外の方からアドバイスをいただいたことがなかったので、今回はそういったことを目的に参加しました。
    あと世界平和のためです。
  # 見つけた場所
  via:
    # どこでこのワークショップを知りましたか？
    X
  # 開発対象
  target:
    # ワークショップで開発対象に選んだプロダクトはなんですか？
    PicoRuby.wasm
  # 今後のRubyエコシステムの開発への参加について
  future:
    # このワークショップで開発への参加の敷居は下がりましたか？
    # 今後は問題を見つけたときに開発元にフィードバックしたり修正を送ったり
    # できそうですか？
    # まだ参加への障害がありそうなら教えてください。
    問題を見つけた時に開発元のフィードバックしたり修正を送ったりできそうです！
  # その他
  etc:
    # なにか思ったことがあれば自由に書いてください。
    見落としていたら申し訳ないのですが、このイベントのハッシュタグ等はありますか？Xで普段イベントについて呟くのが趣味なので気になっていました。
