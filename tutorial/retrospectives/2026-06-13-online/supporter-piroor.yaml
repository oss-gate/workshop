type: supporter
questions:
  # 参加した理由
  motivation:
    継続的に開催するため
  # 見つけた場所
  via:
    oss-gate/general
  # このワークショップでビギナーをサポートできましたか？
  supported:
    - 非常にサポートできた
  # 満足度
  satisfaction-rating:
    - すごく満足した
  # 想定との違い
  difference:
    - 想定通りだった
  # 進行役について
  moderator:
    説明の順番が前後した部分、説明に時間を割きすぎて予定より時間が遅れた部分があったが、おおむね想定の範囲内で進行できたと思われる
  # サポートメンターについて
  support-mentor:
    今回は不在
  # 進行役のやりやすさについて
  moderator-likely:
    - 自分一人でもなんとかやれそう
  # 次回のOSS Gateワークショップについて
  next:
    - サポーターとして参加する
    - 進行役として参加する
  # ワークショップへの関心度
  active-rate:
    Doorkeeper、チャットで情報を知って開催を把握する事が増えた。
  # 次に変えて試すこと
  challenge-planning:
    「再現手順・起こったこと・期待したこと」のフォーマットが報告にそぐわないパターン向けの説明を用意できているとよい。
  # その他
  etc:
    進行自体は自信を持って一人でできるのだが、イベントそのものについて、運営・サポーター側が自分一人だけだと、心細さを強く感じたり、責任者としての重圧を強く感じたりする。実際に手助けしてもらう場面はそこまで多くなくとも、サポーターがもう1人いるだけで、そういった重圧はだいぶ減る印象がある。進行役・サポーター側も最低催行人数を2名からとしたほうが、進行役の負担が減って、継続的に開催しやすくなるのではないか？　他の人が進行役を引き受けてくれる場合でも、なるべくサポーター参加するようにしたい。
